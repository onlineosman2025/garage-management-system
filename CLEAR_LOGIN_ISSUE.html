<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Login Issue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #333; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        button {
            background: #FF6600;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem;
        }
        button:hover {
            background: #E55A00;
        }
        .success {
            color: #10b981;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Fix Login Issue</h1>
        <p>If you're stuck on "Logging in..." screen, click the button below to clear your session and try again.</p>
        
        <button onclick="clearAndRedirect()">Clear Session & Go to Login</button>
        
        <p class="success" id="success">✅ Session cleared! Redirecting...</p>
        
        <hr style="margin: 2rem 0;">
        
        <h3>Current Session Data:</h3>
        <div id="sessionData" style="text-align: left; background: #f5f5f5; padding: 1rem; border-radius: 5px; margin-top: 1rem; font-family: monospace; font-size: 0.9rem;"></div>
    </div>

    <script>
        // Display current session data
        function displaySessionData() {
            const authToken = localStorage.getItem('auth_token');
            const userData = localStorage.getItem('user_data');
            const garageData = localStorage.getItem('garage_data');
            
            let html = '';
            html += '<strong>Auth Token:</strong> ' + (authToken ? '✅ Present' : '❌ Not found') + '<br>';
            html += '<strong>User Data:</strong> ' + (userData ? '✅ Present' : '❌ Not found') + '<br>';
            html += '<strong>Garage Data:</strong> ' + (garageData ? '✅ Present' : '❌ Not found') + '<br><br>';
            
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    html += '<strong>User Info:</strong><br>';
                    html += 'Email: ' + (user.email || 'N/A') + '<br>';
                    html += 'Role: ' + (user.role || 'N/A') + '<br>';
                    html += 'Name: ' + (user.name || 'N/A') + '<br>';
                } catch (e) {
                    html += '<strong style="color: red;">Error parsing user data!</strong><br>';
                }
            }
            
            document.getElementById('sessionData').innerHTML = html;
        }
        
        function clearAndRedirect() {
            // Clear all localStorage
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
            localStorage.removeItem('garage_data');
            
            // Show success message
            document.getElementById('success').style.display = 'block';
            
            // Redirect to login page after 1 second
            setTimeout(() => {
                window.location.href = '/index.html';
            }, 1000);
        }
        
        // Display session data on load
        displaySessionData();
    </script>
</body>
</html>

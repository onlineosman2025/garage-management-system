<!DOCTYPE html>
<html>
<head><title>Render Test</title></head>
<body>
    <h1>🧪 Render Backend Test</h1>
    <p>Testing: https://garage-management-system-oa8e.onrender.com/api/health</p>
    <div id="result">Loading...</div>
    
    <script>
        fetch('https://garage-management-system-oa8e.onrender.com/api/health')
            .then(r => r.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<h2>✅ SUCCESS!</h2><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<h2>❌ ERROR!</h2><p>' + error.message + '</p>';
            });
    </script>
</body>
</html>

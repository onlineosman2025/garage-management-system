<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management - GMS</title>
    <link rel="stylesheet" href="professional_modal_styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #FF6B35 0%, #FFA726 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: white;
            color: #FF6B35;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #FF6B35;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .inventory-table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .table-header {
            background: #f8f9fa;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            width: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .stock-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-high {
            background: #d4edda;
            color: #155724;
        }

        .status-medium {
            background: #fff3cd;
            color: #856404;
        }

        .status-low {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.2s;
        }

        .btn-edit {
            background: #007bff;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 0;
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .modal-header {
            background: linear-gradient(135deg, #FF6B35 0%, #FFA726 100%);
            padding: 20px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: white;
            margin: 0;
            font-size: 1.5em;
            font-weight: bold;
        }

        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .modal-body {
            padding: 40px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }

        .modal-body form {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FF6B35;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF6B35;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📦 Inventory Management</div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openAddItemModal()">+ Add Item</button>
            <button class="btn btn-secondary" onclick="goBack()">← Back to Dashboard</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalItems">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lowStockItems">0</div>
                <div class="stat-label">Low Stock Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalValue">$0</div>
                <div class="stat-label">Total Inventory Value</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="categories">0</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>

        <div class="inventory-table">
            <div class="table-header">
                <h3>Inventory Items</h3>
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search items...">
                    <button class="btn btn-primary" onclick="searchItems()">Search</button>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                Loading inventory...
            </div>

            <table id="inventoryTable">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Category</th>
                        <th>SKU</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Total Value</th>
                        <th>Stock Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <!-- Items will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div id="itemModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Item</h3>
                <button class="modal-close" onclick="closeItemModal()">&times;</button>
            </div>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                
                <div class="form-group">
                    <label for="itemName">Item Name *</label>
                    <input type="text" id="itemName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="itemCategory">Category *</label>
                    <select id="itemCategory" name="category" required>
                        <option value="">Select Category</option>
                        <option value="Engine Parts">Engine Parts</option>
                        <option value="Brake Parts">Brake Parts</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Fluids">Fluids</option>
                        <option value="Filters">Filters</option>
                        <option value="Tools">Tools</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="itemSku">SKU *</label>
                    <input type="text" id="itemSku" name="sku" required>
                </div>

                <div class="form-group">
                    <label for="itemQuantity">Quantity *</label>
                    <input type="number" id="itemQuantity" name="quantity" min="0" required>
                </div>

                <div class="form-group">
                    <label for="itemPrice">Unit Price *</label>
                    <input type="number" id="itemPrice" name="price" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="itemMinStock">Minimum Stock Level</label>
                    <input type="number" id="itemMinStock" name="min_stock" min="0" value="5">
                </div>

                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" name="description" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeItemModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveItemBtn">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="hamburger-menu.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/api.js"></script>
    <script src="professional_notifications.js"></script>
    <script>
        let inventoryData = [
            {
                id: 1,
                name: 'Engine Oil 5W-30',
                category: 'Fluids',
                sku: 'EO-5W30-001',
                quantity: 25,
                price: 35.99,
                min_stock: 10,
                description: 'High quality synthetic engine oil'
            },
            {
                id: 2,
                name: 'Brake Pads - Front',
                category: 'Brake Parts',
                sku: 'BP-FRONT-002',
                quantity: 8,
                price: 89.99,
                min_stock: 5,
                description: 'Premium ceramic brake pads'
            },
            {
                id: 3,
                name: 'Air Filter',
                category: 'Filters',
                sku: 'AF-STD-003',
                quantity: 3,
                price: 24.99,
                min_stock: 10,
                description: 'Standard air filter for most vehicles'
            },
            {
                id: 4,
                name: 'Spark Plugs Set',
                category: 'Engine Parts',
                sku: 'SP-SET-004',
                quantity: 15,
                price: 45.99,
                min_stock: 8,
                description: 'Set of 4 platinum spark plugs'
            },
            {
                id: 5,
                name: 'Battery 12V',
                category: 'Electrical',
                sku: 'BAT-12V-005',
                quantity: 6,
                price: 129.99,
                min_stock: 3,
                description: 'Maintenance-free car battery'
            }
        ];

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            if (!api.isAuthenticated()) {
                window.location.href = '/index.html';
                return;
            }
            loadInventory();
            updateStats();
        });

        function loadInventory() {
            showLoading(true);
            
            setTimeout(() => {
                displayInventory(inventoryData);
                showLoading(false);
            }, 500);
        }

        function displayInventory(items) {
            const tbody = document.getElementById('inventoryTableBody');
            
            tbody.innerHTML = items.map(item => {
                const totalValue = item.quantity * item.price;
                const stockStatus = getStockStatus(item.quantity, item.min_stock);
                
                return `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.category}</td>
                        <td>${item.sku}</td>
                        <td>${item.quantity}</td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td>$${totalValue.toFixed(2)}</td>
                        <td>
                            <span class="stock-status status-${stockStatus.class}">
                                ${stockStatus.label}
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn btn-edit" onclick="editItem(${item.id})">Edit</button>
                                <button class="action-btn btn-delete" onclick="deleteItem(${item.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStockStatus(quantity, minStock) {
            if (quantity <= minStock) {
                return { class: 'low', label: 'Low Stock' };
            } else if (quantity <= minStock * 2) {
                return { class: 'medium', label: 'Medium Stock' };
            } else {
                return { class: 'high', label: 'High Stock' };
            }
        }

        function updateStats() {
            const totalItems = inventoryData.length;
            const lowStockItems = inventoryData.filter(item => item.quantity <= item.min_stock).length;
            const totalValue = inventoryData.reduce((sum, item) => sum + (item.quantity * item.price), 0);
            const categories = [...new Set(inventoryData.map(item => item.category))].length;

            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('lowStockItems').textContent = lowStockItems;
            document.getElementById('totalValue').textContent = '$' + totalValue.toFixed(2);
            document.getElementById('categories').textContent = categories;
        }

        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredItems = inventoryData.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.category.toLowerCase().includes(query) ||
                item.sku.toLowerCase().includes(query)
            );
            displayInventory(filteredItems);
        }

        function openAddItemModal() {
            document.getElementById('modalTitle').textContent = 'Add New Item';
            document.getElementById('itemForm').reset();
            document.getElementById('itemId').value = '';
            document.getElementById('itemModal').style.display = 'flex';
        }

        function editItem(id) {
            const item = inventoryData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalTitle').textContent = 'Edit Item';
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('itemSku').value = item.sku;
            document.getElementById('itemQuantity').value = item.quantity;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemMinStock').value = item.min_stock;
            document.getElementById('itemDescription').value = item.description || '';
            
            document.getElementById('itemModal').style.display = 'flex';
        }

        function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            inventoryData = inventoryData.filter(item => item.id !== id);
            displayInventory(inventoryData);
            updateStats();
            alert('Item deleted successfully!');
        }

        function closeItemModal() {
            document.getElementById('itemModal').style.display = 'none';
        }

        // Handle form submission
        document.getElementById('itemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const itemData = Object.fromEntries(formData.entries());
            const itemId = document.getElementById('itemId').value;

            // Convert numeric fields
            itemData.quantity = parseInt(itemData.quantity);
            itemData.price = parseFloat(itemData.price);
            itemData.min_stock = parseInt(itemData.min_stock);

            if (itemId) {
                // Update existing item
                const index = inventoryData.findIndex(item => item.id === parseInt(itemId));
                if (index !== -1) {
                    inventoryData[index] = { ...inventoryData[index], ...itemData };
                    alert('Item updated successfully!');
                }
            } else {
                // Add new item
                const newItem = {
                    id: Math.max(...inventoryData.map(i => i.id)) + 1,
                    ...itemData
                };
                inventoryData.push(newItem);
                alert('Item added successfully!');
            }

            closeItemModal();
            displayInventory(inventoryData);
            updateStats();
        });

        function goBack() {
            window.location.href = '/garage-dashboard.html';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('inventoryTable').style.display = show ? 'none' : 'table';
        }
    </script>
</body>
</html>

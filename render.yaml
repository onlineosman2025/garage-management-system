services:
  - type: web
    name: garage-management-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 test_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production

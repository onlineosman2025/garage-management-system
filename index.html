<!DOCTYPE html>
<!-- Version: 2025-11-03-10-15-FORCE-DEPLOY - Trigger Netlify update - CRITICAL -->
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6600">
    <title>Garage Management System</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="stylesheet" href="mobile-responsive.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fff5f0 0%, #ffffff 50%, #fff8f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: ltr;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 102, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 140, 50, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(255, 120, 30, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(45deg, transparent 30%, rgba(255, 102, 0, 0.02) 50%, transparent 70%),
                linear-gradient(-45deg, transparent 30%, rgba(255, 140, 50, 0.02) 50%, transparent 70%);
            z-index: -1;
        }

        .rtl {
            direction: rtl;
        }

        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 
                0 10px 40px rgba(255, 102, 0, 0.1),
                0 4px 12px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 102, 0, 0.1);
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3.2em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #FF6600 0%, #FF8C32 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(255, 102, 0, 0.2));
        }

        .title {
            font-size: 1.9em;
            margin-bottom: 35px;
            color: #1a1a1a;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f8f8f8;
            font-family: inherit;
            color: #1a1a1a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6600;
            background: #ffffff;
            box-shadow: 
                0 0 0 3px rgba(255, 102, 0, 0.1),
                0 4px 12px rgba(255, 102, 0, 0.15);
            transform: translateY(-2px);
        }

        .form-group input::placeholder {
            color: #999999;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #FF6600 0%, #FF8C32 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 102, 0, 0.4);
            background: linear-gradient(135deg, #FF7700 0%, #FF9D43 100%);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .language-switcher {
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .language-switcher button {
            padding: 10px 18px;
            border: 2px solid #e5e5e5;
            background: #f8f8f8;
            color: #666666;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 0.9em;
            font-family: inherit;
        }

        .language-switcher button:hover {
            border-color: #FF6600;
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.15);
            color: #FF6600;
        }

        .language-switcher button.active {
            background: linear-gradient(135deg, #FF6600 0%, #FF8C32 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }

        .loading {
            display: none;
            margin: 25px 0;
        }

        .spinner {
            border: 3px solid #ffe5d9;
            border-top: 3px solid #FF6600;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 40px 30px;
                max-width: none;
            }
            
            .logo {
                font-size: 2.8em;
            }
            
            .title {
                font-size: 1.6em;
            }
            
            .language-switcher {
                flex-wrap: wrap;
            }
        }

        /* Loading text color */
        .loading p {
            color: #666666;
            margin-top: 12px;
            font-weight: 500;
        }

        /* Accessibility improvements */
        .login-btn:focus,
        .language-switcher button:focus {
            outline: 2px solid #FF6600;
            outline-offset: 2px;
        }

        /* Animation for better UX */
        .form-group {
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚗</div>
        <h1 class="title" data-translate="title">Garage Management System</h1>
        
        <div class="language-switcher">
            <button class="active" onclick="setLanguage('en')">English</button>
            <button onclick="setLanguage('ar')">العربية</button>
            <button onclick="setLanguage('ur')">اردو</button>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email" data-translate="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password" data-translate="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn" data-translate="login">Login</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e1e5e9;">
            <p style="color: #666; font-size: 14px; margin-bottom: 10px;">
                Don't have an account?
            </p>
            <a href="signup.html" style="display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: all 0.3s;">
                <i class="fas fa-rocket"></i> Start 14-Day Free Trial
            </a>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p data-translate="logging_in">Logging in...</p>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script>
        // Translations
        const translations = {
            en: {
                title: "Garage Management System",
                email: "Email",
                password: "Password", 
                login: "Login",
                logging_in: "Logging in..."
            },
            ar: {
                title: "نظام إدارة الورشة",
                email: "البريد الإلكتروني",
                password: "كلمة المرور",
                login: "تسجيل الدخول",
                logging_in: "جاري تسجيل الدخول..."
            },
            ur: {
                title: "گیراج منیجمنٹ سسٹم",
                email: "ای میل",
                password: "پاس ورڈ",
                login: "لاگ ان",
                logging_in: "لاگ ان ہو رہے ہیں..."
            }
        };

        let currentLanguage = 'en';

        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Save language preference to localStorage
            localStorage.setItem('preferred_language', lang);
            
            // Also update in SettingsManager if available
            if (window.SettingsManager) {
                window.SettingsManager.set('business.language', lang);
            }
            
            // Update direction
            document.documentElement.dir = (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr';
            
            // Update active button
            document.querySelectorAll('.language-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update translations
            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }


        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Mobile debugging
            console.log('[MOBILE DEBUG] Login attempt');
            console.log('[MOBILE DEBUG] Email:', email);
            console.log('[MOBILE DEBUG] Password:', password);
            console.log('[MOBILE DEBUG] User Agent:', navigator.userAgent);
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.querySelector('.login-btn').disabled = true;
            
            try {
                // Ensure demo accounts exist (wake up backend and create accounts)
                if (email.includes('admin') || email.includes('owner')) {
                    console.log('[DEMO] Ensuring demo accounts exist...');
                    try {
                        await fetch('https://garage-management-system-oa8e.onrender.com/api/setup/create-demo-accounts');
                        console.log('[DEMO] Demo accounts ready');
                    } catch (e) {
                        console.log('[DEMO] Account creation check failed, continuing...');
                    }
                }
                
                // Real API login call
                console.log('[MOBILE DEBUG] Calling API.login...');
                const loginData = await api.login(email, password);
                console.log('[MOBILE DEBUG] API Response:', loginData);
                
                // Determine user role and redirect based on actual user data
                const userRole = loginData.user.role || 'customer';
                
                if (userRole === 'admin' || email.includes('admin')) {
                    window.location.href = '/admin-dashboard.html';
                } else if (userRole === 'garage_owner' || email.includes('owner')) {
                    window.location.href = '/garage-dashboard.html';
                } else {
                    window.location.href = '/customer-dashboard.html';
                }
                
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed: ' + (error.message || 'Please check your credentials'));
            } finally {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.login-btn').disabled = false;
            }
        });

        // Check if user is already logged in and redirect
        function checkExistingLogin() {
            const authToken = localStorage.getItem('auth_token');
            const userData = localStorage.getItem('user_data');
            
            if (authToken && userData) {
                console.log('[AUTO-LOGIN] User already logged in, redirecting...');
                try {
                    const user = JSON.parse(userData);
                    const userRole = user.role || 'customer';
                    
                    // Redirect based on role
                    if (userRole === 'admin' || user.email?.includes('admin')) {
                        window.location.href = '/admin-dashboard.html';
                    } else if (userRole === 'garage_owner' || user.email?.includes('owner')) {
                        window.location.href = '/garage-dashboard.html';
                    } else {
                        window.location.href = '/customer-dashboard.html';
                    }
                } catch (error) {
                    console.error('[AUTO-LOGIN] Error parsing user data:', error);
                    // Clear invalid data
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_data');
                }
            }
        }

        // Load saved language preference on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Check for existing login first
            checkExistingLogin();
            
            const savedLang = localStorage.getItem('preferred_language') || 'en';
            if (savedLang !== 'en') {
                // Simulate click on the language button
                const langButton = document.querySelector(`[onclick="setLanguage('${savedLang}')"]`);
                if (langButton) {
                    langButton.click();
                }
            }
        });
    </script>
    <script src="pwa-installer.js"></script>
</body>
</html>

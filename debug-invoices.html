<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Debug - GMS</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
        }
        h1 {
            color: #00ffff;
        }
        .section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #00ff00;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        button:hover {
            background: #00ffff;
        }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            color: #00ff00;
        }
        .error {
            color: #ff0000;
        }
        .success {
            color: #00ff00;
        }
        .warning {
            color: #ffff00;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #00ff00;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #003300;
        }
    </style>
</head>
<body>
    <h1>🔍 Invoice Debug Console</h1>
    
    <div class="section">
        <h2>Quick Actions</h2>
        <button onclick="checkInvoices()">Check Invoices</button>
        <button onclick="checkCustomers()">Check Customers</button>
        <button onclick="checkBoth()">Check Both</button>
        <button onclick="location.reload()">Refresh Page</button>
        <button onclick="window.location.href='/invoices.html'">Go to Invoices Page</button>
    </div>

    <div class="section">
        <h2>📊 Invoice Data</h2>
        <div id="invoiceResults">Click "Check Invoices" to load data...</div>
    </div>

    <div class="section">
        <h2>👥 Customer Data</h2>
        <div id="customerResults">Click "Check Customers" to load data...</div>
    </div>

    <div class="section">
        <h2>🔗 Relationship Check</h2>
        <div id="relationshipResults">Click "Check Both" to analyze relationships...</div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function checkInvoices() {
            const output = document.getElementById('invoiceResults');
            output.innerHTML = '<p class="warning">Loading...</p>';
            
            try {
                const response = await fetch('http://localhost:3000/api/debug/invoices');
                const data = await response.json();
                
                let html = `<p class="success">✅ Found ${data.count} invoices</p>`;
                
                if (data.invoices.length === 0) {
                    html += '<p class="warning">⚠️ No invoices in database</p>';
                } else {
                    html += '<table>';
                    html += '<tr><th>ID</th><th>Customer ID</th><th>Amount</th><th>Tax Rate</th><th>Tax Amount</th><th>Total</th><th>Status</th></tr>';
                    
                    data.invoices.forEach(inv => {
                        const hasCustomer = data.customers.find(c => c.id === inv.customer_id);
                        const rowClass = hasCustomer ? '' : ' class="error"';
                        html += `<tr${rowClass}>`;
                        html += `<td>${inv.id}</td>`;
                        html += `<td>${inv.customer_id || 'NULL'} ${!hasCustomer ? '❌' : '✅'}</td>`;
                        html += `<td>${inv.amount}</td>`;
                        html += `<td>${inv.tax_rate}%</td>`;
                        html += `<td>${inv.tax_amount || 'MISSING'}</td>`;
                        html += `<td>${inv.total_amount || 'MISSING'}</td>`;
                        html += `<td>${inv.status}</td>`;
                        html += '</tr>';
                    });
                    html += '</table>';
                }
                
                html += '<h3>Raw Data:</h3>';
                html += '<pre>' + JSON.stringify(data.invoices, null, 2) + '</pre>';
                
                output.innerHTML = html;
            } catch (error) {
                output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function checkCustomers() {
            const output = document.getElementById('customerResults');
            output.innerHTML = '<p class="warning">Loading...</p>';
            
            try {
                const response = await fetch('http://localhost:3000/api/debug/customers');
                const data = await response.json();
                
                let html = `<p class="success">✅ Found ${data.count} customers</p>`;
                
                html += '<table>';
                html += '<tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr>';
                
                data.customers.forEach(cust => {
                    html += '<tr>';
                    html += `<td>${cust.id}</td>`;
                    html += `<td>${cust.name}</td>`;
                    html += `<td>${cust.email}</td>`;
                    html += `<td>${cust.phone}</td>`;
                    html += '</tr>';
                });
                html += '</table>';
                
                html += '<h3>Raw Data:</h3>';
                html += '<pre>' + JSON.stringify(data.customers, null, 2) + '</pre>';
                
                output.innerHTML = html;
            } catch (error) {
                output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function checkBoth() {
            await checkInvoices();
            await checkCustomers();
            
            const output = document.getElementById('relationshipResults');
            output.innerHTML = '<p class="warning">Analyzing...</p>';
            
            try {
                const invResponse = await fetch('http://localhost:3000/api/debug/invoices');
                const invData = await invResponse.json();
                
                let html = '<h3>Relationship Analysis:</h3>';
                
                const orphanedInvoices = invData.invoices.filter(inv => {
                    return !invData.customers.find(c => c.id === inv.customer_id);
                });
                
                if (orphanedInvoices.length > 0) {
                    html += `<p class="error">❌ Found ${orphanedInvoices.length} invoices with invalid customer_id:</p>`;
                    html += '<ul>';
                    orphanedInvoices.forEach(inv => {
                        html += `<li class="error">Invoice #${inv.id} has customer_id=${inv.customer_id} (customer not found)</li>`;
                    });
                    html += '</ul>';
                    html += '<p class="warning">⚠️ This is why they show as "Unknown" in the invoice list!</p>';
                } else {
                    html += '<p class="success">✅ All invoices have valid customer references</p>';
                }
                
                // Check for missing tax_amount
                const missingTax = invData.invoices.filter(inv => !inv.tax_amount && inv.tax_amount !== 0);
                if (missingTax.length > 0) {
                    html += `<p class="warning">⚠️ Found ${missingTax.length} invoices missing tax_amount field</p>`;
                }
                
                output.innerHTML = html;
            } catch (error) {
                output.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        // Auto-run on load
        window.addEventListener('DOMContentLoaded', () => {
            checkBoth();
        });
    </script>
</body>
</html>
